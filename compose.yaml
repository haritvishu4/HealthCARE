# Local PostgreSQL development. Change the password before exposing a database.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: care
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - care_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care -d care"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    profiles: [container-api]
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://care:change-me@db:5432/care
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  care_db:
