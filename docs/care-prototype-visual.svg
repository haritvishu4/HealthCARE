  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="315" y="112" width="770" height="72" rx="28" fill="#123e33"/>
    <rect x="315" y="156" width="770" height="28" fill="#123e33"/>
    <rect x="350" y="134" width="28" height="28" rx="9" fill="#3a9b7e"/>
    <path d="M364 140v16M356 148h16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="393" y="155" font-size="19" font-weight="700" fill="#fff">care<tspan fill="#8cc7ab">.</tspan></text>
    <text x="978" y="153" font-size="11" letter-spacing="1.5" text-anchor="end" fill="#b1d2bf">YOUR HEALTH WORKSPACE</text>
    <text x="365" y="237" font-size="13" font-weight="700" letter-spacing="2" fill="#6a927e">PATIENT INTAKE</text>
    <text x="365" y="279" font-size="31" font-weight="700" fill="#193d31">Your story, in your words.</text>
    <text x="365" y="309" font-size="15" fill="#6f8579">A calmer way to prepare for a better conversation.</text>
    <rect x="365" y="346" width="270" height="138" rx="16" fill="#edf7f1"/>
    <circle cx="416" cy="396" r="30" fill="#b8dfca"/>
    <circle cx="416" cy="388" r="11" fill="#177c65"/>
    <path d="M397 425c3-19 35-19 38 0" fill="#177c65"/>
