    <circle cx="966" cy="524" r="20" fill="#d5ebdf"/>
    <path d="m956 524 7 7 13-15" fill="none" stroke="#177c65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
