      <circle cx="96" cy="179" r="4" fill="#193d31"/><circle cx="130" cy="179" r="4" fill="#193d31"/>
      <path d="M103 198c8 6 16 6 24 0" fill="none" stroke="#9b5b4f" stroke-width="3" stroke-linecap="round"/>
      <path d="M75 243 34 275M151 243l44 28" stroke="#f1bd97" stroke-width="22" stroke-linecap="round"/>
      <text x="112" y="363" text-anchor="middle" font-size="15" font-weight="700" fill="#193d31">Patient</text>
      <text x="112" y="386" text-anchor="middle" font-size="12" fill="#557468">Share your story</text>
    </g>
    <g transform="translate(1114 294)">
      <ellipse cx="110" cy="322" rx="95" ry="20" fill="#78ae8f" opacity=".3"/>
      <path d="M71 221h80l20 101H48Z" fill="#fff" stroke="#cfe4d7" stroke-width="3"/>
      <path d="M100 224h22v78h-22Z" fill="#d8eee1"/>
      <circle cx="111" cy="173" r="48" fill="#c98966"/>
      <path d="M65 174c-5-51 28-75 66-62 24 8 36 31 29 61-13-20-19-37-28-54-18 29-37 46-67 55Z" fill="#503a32"/>
      <circle cx="94" cy="179" r="4" fill="#193d31"/><circle cx="130" cy="179" r="4" fill="#193d31"/>
      <path d="M101 198c8 6 16 6 24 0" fill="none" stroke="#864c42" stroke-width="3" stroke-linecap="round"/>
      <path d="M71 244 29 278M153 244l44 28" stroke="#c98966" stroke-width="22" stroke-linecap="round"/>
      <circle cx="182" cy="258" r="18" fill="#177c65"/><path d="m174 258 6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="111" y="369" text-anchor="middle" font-size="15" font-weight="700" fill="#193d31">Doctor</text>
      <text x="111" y="392" text-anchor="middle" font-size="12" fill="#557468">Review with context</text>
