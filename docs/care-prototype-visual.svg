<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Care Intake prototype visual</title>
  <desc id="desc">An editorial illustration of a patient sharing a health story with a doctor through the Care Intake workspace.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f2"/>
      <stop offset="1" stop-color="#d5ebe0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5faf7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#269979"/>
      <stop offset="1" stop-color="#116a55"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#174936" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="34" fill="url(#canvas)"/>
  <path d="M-80 170c130-175 310-193 430-83 107 98 37 196-85 229-149 40-291 25-345-146Z" fill="#c1e2cf" opacity=".8"/>
  <path d="M1120 40c197-64 329 40 334 184 5 145-111 208-222 158-106-48-169-228-112-342Z" fill="#b9ddca" opacity=".85"/>
  <path d="M-35 680c77-126 202-153 298-90 91 60 63 153-40 183H-35Z" fill="#a8d4bc" opacity=".7"/>
  <circle cx="1160" cy="632" r="106" fill="#c1e3d0" opacity=".9"/>
  <g fill="none" stroke="#6caf8e" stroke-width="3" opacity=".45">
    <path d="M50 315c80-42 157-33 212 25"/>
    <path d="M1148 260c72-31 139-21 187 28"/>
    <circle cx="111" cy="111" r="16"/>
    <circle cx="1287" cy="574" r="22"/>
  </g>
  <g filter="url(#lift)">
