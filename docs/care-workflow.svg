<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Care Intake patient and doctor workflow</title>
  <desc id="desc">A calm green workflow illustration showing patients completing an intake and doctors reviewing the shared consultation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5faf7"/>
      <stop offset="1" stop-color="#e7f2ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#174936" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="170" fill="#d7ebe0" opacity=".65"/>
  <circle cx="110" cy="560" r="190" fill="#dcefe4" opacity=".7"/>
  <path d="M285 308h630" stroke="#8bbda5" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 18"/>
  <path d="m892 286 36 22-36 22" fill="none" stroke="#4d9a78" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="72" y="92" width="285" height="420" rx="22" fill="#fff"/>
    <rect x="843" y="92" width="285" height="420" rx="22" fill="#fff"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#193d31">
    <text x="108" y="145" font-size="14" font-weight="700" letter-spacing="2" fill="#63917b">PATIENT PATH</text>
    <text x="108" y="188" font-size="28" font-weight="700">Tell your story</text>
    <text x="108" y="219" font-size="15" fill="#6e8378">A guided start to better care.</text>
    <circle cx="130" cy="284" r="28" fill="#d9eee3"/>
    <path d="M130 270c-8 0-14 6-14 14s6 14 14 14 14-6 14-14-6-14-14-14Zm-22 45c0-10 10-18 22-18s22 8 22 18" fill="none" stroke="#177c65" stroke-width="5" stroke-linecap="round"/>
    <text x="180" y="279" font-size="16" font-weight="700">Complete intake</text>
    <text x="180" y="302" font-size="13" fill="#7b9084">Questions, history, documents</text>
    <circle cx="130" cy="366" r="28" fill="#d9eee3"/>
    <path d="M116 366h28M130 352v28" stroke="#177c65" stroke-width="5" stroke-linecap="round"/>
    <text x="180" y="361" font-size="16" font-weight="700">Review your answers</text>
    <text x="180" y="384" font-size="13" fill="#7b9084">You stay in control</text>
    <rect x="108" y="437" width="210" height="38" rx="10" fill="#177c65"/>
    <text x="213" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Share with doctor</text>

    <text x="879" y="145" font-size="14" font-weight="700" letter-spacing="2" fill="#63917b">DOCTOR PATH</text>
    <text x="879" y="188" font-size="28" font-weight="700">Review with context</text>
    <text x="879" y="219" font-size="15" fill="#6e8378">A clearer clinical workspace.</text>
    <circle cx="901" cy="284" r="28" fill="#d9eee3"/>
    <path d="M901 269v29M886 284h30M893 270h16" fill="none" stroke="#177c65" stroke-width="5" stroke-linecap="round"/>
    <text x="951" y="279" font-size="16" font-weight="700">Open dashboard</text>
    <text x="951" y="302" font-size="13" fill="#7b9084">Shared consultations in one view</text>
    <circle cx="901" cy="366" r="28" fill="#d9eee3"/>
    <path d="m888 367 9 9 18-20" fill="none" stroke="#177c65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="951" y="361" font-size="16" font-weight="700">Add clinical review</text>
    <text x="951" y="384" font-size="13" fill="#7b9084">Notes and draft decisions</text>
    <rect x="879" y="437" width="210" height="38" rx="10" fill="#123e33"/>
    <text x="984" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Doctor-only workspace</text>
  </g>
  <g transform="translate(523 250)">
    <circle cx="77" cy="58" r="72" fill="#fff" stroke="#8bbda5" stroke-width="3"/>
    <path d="M77 26v64M45 58h64" stroke="#177c65" stroke-width="8" stroke-linecap="round"/>
    <text x="77" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#527766">SECURE HANDOFF</text>
  </g>
</svg>
